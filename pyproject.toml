[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coral-microscopy"
version = "0.1.0"
description = "Automated detection and stage classification of coral oocytes from H&E whole-slide images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.0",
    "opencv-python>=4.12.0.88",
    "openslide-bin>=4.0.0.8",
    "openslide-python>=1.4.2",
    "pandas>=2.3.3",
    "Pillow>=11.0",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tifffile>=2025.10.16",
    "zarr==3.1.3",
]

[project.optional-dependencies]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]
notebooks = [
    "jupyter>=1.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.3",
    "torchstain>=1.4",
]
sharepoint = [
    "msal>=1.28",
]

[project.scripts]
coral-download-ndpi = "scripts.download_ndpi:main"
coral-remap-annotations = "scripts.remap_annotations:main"
coral-generate-tiles = "scripts.generate_tiles:main"
coral-geojson-to-yolo = "scripts.geojson_to_yolo:main"
coral-extract-rois = "scripts.extract_ndpi_rois:main"
coral-download-geojson = "scripts.download_geojson:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_preparation", "scripts"]
